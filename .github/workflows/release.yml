name: Release

# Builds Reevun for Windows, publishes its installer (Reevun_Setup.exe,
# which installed apps also update themselves with) as a GitHub release, and
# keeps the Microsoft Store package with the run. Runs on every change here
# and on every change to app-core (app-core sends "core-updated").
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [core-updated]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: windows-app
      - uses: actions/checkout@v5
        with:
          repository: reevun-software/app-core
          token: ${{ secrets.DESKTOP_CI_TOKEN }}
          path: app-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # The app's own screens, one self-contained page built into the app.
      - name: Screens
        shell: bash
        run: |
          npm --prefix app-core ci
          npm --prefix app-core run build
          mkdir -p windows-app/Screens
          cp app-core/dist/index.html windows-app/Screens/
      - name: Build
        working-directory: windows-app
        run: dotnet publish -c Release -p:Platform=x64 -p:Version=${{ env.VERSION }} -o publish
      # Inno Setup (on the runner already), with its Chinese translation:
      # shipped with it in newer versions, else from its source.
      - name: Installer
        working-directory: windows-app
        shell: pwsh
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
          $chinese = "$inno\Languages\ChineseSimplified.isl"
          if (Test-Path $chinese) { Copy-Item $chinese Installer\ }
          else { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/is-6_4_3/Files/Languages/Unofficial/ChineseSimplified.isl -OutFile Installer\ChineseSimplified.isl }
          & "$inno\ISCC.exe" /Q "/DVersion=${{ env.VERSION }}" Installer\Reevun.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Installed and started as a person would (through the update check);
      # the screen after a while goes into the log (a small JPEG, base64) to
      # look at.
      - name: Install and start
        working-directory: windows-app
        shell: pwsh
        run: |
          Start-Process release\Reevun_Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $app = Start-Process "$env:LOCALAPPDATA\Programs\Reevun\Reevun.exe" -PassThru
          Start-Sleep 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $small = New-Object System.Drawing.Bitmap $bitmap, ([int]($bounds.Width * 0.6)), ([int]($bounds.Height * 0.6))
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $quality = New-Object System.Drawing.Imaging.EncoderParameters 1
          $quality.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 60L
          $small.Save("screen.jpg", $codec, $quality)
          $text = [Convert]::ToBase64String([IO.File]::ReadAllBytes("screen.jpg"))
          "SCREEN-BEGIN"; for ($i = 0; $i -lt $text.Length; $i += 1000) { $text.Substring($i, [Math]::Min(1000, $text.Length - $i)) }; "SCREEN-END"
          if ($app.HasExited) {
            "The app closed by itself (exit code $($app.ExitCode)):"
            Get-Content "$env:LOCALAPPDATA\Reevun\crash.log" -ErrorAction SilentlyContinue
            Get-WinEvent -LogName Application -MaxEvents 20 | Where-Object ProviderName -in '.NET Runtime', 'Application Error' | Format-List TimeCreated, ProviderName, Message
            exit 1
          }
          Get-Process Reevun | Stop-Process
      # Always Reevun_Setup.exe, so .../releases/latest/download/Reevun_Setup.exe
      # is a permanent download link.
      - name: Publish
        working-directory: windows-app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --title "Reevun $VERSION" --notes "" --latest release/Reevun_Setup.exe
      # The Microsoft Store package: uploaded to Partner Center by hand, so
      # it stays with the run rather than in the public release.
      - name: Store package
        working-directory: windows-app
        run: >
          dotnet publish -c Release -p:Platform=x64 -p:Version=${{ env.VERSION }} -p:WindowsPackageType=MSIX
          -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxPackageDir=store\
      - uses: actions/upload-artifact@v5
        with:
          name: Reevun-Store-${{ env.VERSION }}
          path: windows-app/store/**/*.msix
          if-no-files-found: error
