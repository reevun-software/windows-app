name: Release

# Builds the Windows installers and publishes them as a GitHub release, which
# the installed apps pick up as an update. Runs on every change here and on
# every change to app-core (app-core sends "core-updated").
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [core-updated]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: windows-app
      - uses: actions/checkout@v5
        with:
          repository: reevun-software/app-core
          token: ${{ secrets.DESKTOP_CI_TOKEN }}
          path: app-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Version
        working-directory: windows-app
        run: npm version "${{ env.VERSION }}" --no-git-tag-version
      - name: Install
        working-directory: windows-app
        run: npm ci
      - name: Build
        working-directory: windows-app
        run: npm run dist
      # One call creates the release with both files at once: the installer
      # (always Reevun_Setup.exe, so .../releases/latest/download/Reevun_Setup.exe
      # is a permanent download link) and latest.yml, which installed apps read
      # for updates.
      - name: Publish
        working-directory: windows-app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ env.VERSION }}" --title "Reevun ${{ env.VERSION }}" --notes "" --latest
          release/Reevun_Setup.exe release/latest.yml
      # The Microsoft Store package: uploaded to Partner Center by hand, so it
      # stays with the run rather than in the public release.
      - name: Store package
        uses: actions/upload-artifact@v5
        with:
          name: Reevun-Store-${{ env.VERSION }}
          path: windows-app/release/Reevun.appx
          if-no-files-found: error
